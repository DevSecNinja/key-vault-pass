[workspace]
resolver = "2"
members = ["crates/kvp-core", "crates/kvp-cli", "crates/kvp-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/DevSecNinja/key-vault-pass"
authors = ["DevSecNinja"]

# Only well-known, enterprise-grade, actively maintained crates.
# Versions are Renovate-managed (rangeStrategy: pin) — see renovate.json5.
[workspace.dependencies]
# Azure SDK: disable default features to drop the rustls transport (which pulls
# aws-lc-rs, requiring a C/asm toolchain). We select the reqwest transport with
# gzip/deflate + tokio and provide TLS via reqwest's native-tls (schannel on
# Windows / OS trust store elsewhere) — no C-crypto build required.
azure_core = { version = "1.0.0", default-features = false, features = ["reqwest", "reqwest_gzip", "reqwest_deflate", "tokio"] }
azure_identity = { version = "1.0.0", default-features = false, features = ["tokio"] }
azure_security_keyvault_secrets = { version = "1.0.0", default-features = false }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
zeroize = "1.9"
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.9"
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.4"
axum = { version = "0.8", features = ["macros"] }
tower-sessions = "0.15"
tera = "2.0"
oauth2 = { version = "5.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
url = "2.5"
base64 = "0.22"
time = { version = "0.3", features = ["serde-well-known"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
