{% extends "base.html" %}
{% block title %}New entry · key-vault-pass{% endblock %}
{% block content %}
<div class="toolbar">
  <a class="btn secondary" href="/entries">← Back</a>
</div>

<div class="card">
  <h1>New entry</h1>
  {% if error %}<p style="color:#f87171">{{ error }}</p>{% endif %}
  <form method="post" action="/entries">
    <label for="name">Name (letters, digits, dashes)</label>
    <input type="text" id="name" name="name" required pattern="[0-9A-Za-z-]{1,127}"
      value="{{ name | default(value='') }}">

    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username | default(value='') }}">

    <label for="url">URL</label>
    <input type="text" id="url" name="url" value="{{ url | default(value='') }}">

    <label for="password">Password</label>
    <div class="row">
      <input type="text" id="password" name="password" required
        value="{{ suggested_password | default(value='') }}">
      <button class="btn secondary" type="button" onclick="regen()">Regenerate</button>
    </div>

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="3">{{ notes | default(value='') }}</textarea>

    <p style="margin-top:1.25rem"><button class="btn" type="submit">Save entry</button></p>
  </form>
</div>

<script>
  function regen() {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{}";
    const arr = new Uint32Array(20);
    crypto.getRandomValues(arr);
    let out = "";
    for (const n of arr) { out += chars[n % chars.length]; }
    document.getElementById('password').value = out;
  }
</script>
{% endblock %}
