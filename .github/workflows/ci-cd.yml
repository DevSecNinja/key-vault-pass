---
name: CI/CD

# Single pipeline: lint (reused centrally), build/test, release-please, and a
# tag-gated deploy. Merging the release-please PR creates a vX.Y.Z tag, which
# re-triggers this workflow and runs the deploy job.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Reuse the centralized DevSecNinja lint workflow (yamlfmt, yamllint,
  # actionlint, gitleaks, dprint, trivy, zizmor, checkov, ...).
  lint:
    name: Lint
    uses: DevSecNinja/.github/.github/workflows/lint.yml@27fd66740c629ea38380dcd3bf93e7bc74c54247 # v1.9.0
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.6.11"

  build-test:
    name: Build & test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: DevSecNinja/.github/actions/harden-runner@0eb545afa3246c9600f64df3c55edc5b59e9296d # main
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise (Rust toolchain + lint tools) # zizmor: ignore[cache-poisoning]
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          # Don't read/write the tool cache on tag (publish) events; combined
          # with the ignore above this documents the accepted low-risk posture.
          cache: ${{ github.ref_type != 'tag' }}
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.6.11"

      - name: Check formatting
        run: mise exec -- cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: mise exec -- cargo test --workspace

      - name: Build release
        run: mise exec -- cargo build --workspace --release

  # Opens/updates a release PR on pushes to main; merging it creates the tag.
  release-please:
    name: Release Please
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@27fd66740c629ea38380dcd3bf93e7bc74c54247 # v1.9.0
    permissions:
      contents: write
      pull-requests: write
    with:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  deploy:
    name: Deploy web app
    needs: build-test
    # Deploy only on version tags; configure the vars/secrets below first.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write # required for Entra OIDC federated login
    steps:
      - name: Harden runner
        uses: DevSecNinja/.github/actions/harden-runner@0eb545afa3246c9600f64df3c55edc5b59e9296d # main
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # OIDC login using the Azure CLI directly (no azure/* actions).
      # Configure these repository/environment variables:
      #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      #   ACR_NAME, CONTAINERAPP_NAME, CONTAINERAPP_RG
      - name: Azure login (federated OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value')"
          az login --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --tenant "${AZURE_TENANT_ID}" \
            --federated-token "${token}" >/dev/null
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Build image in ACR and deploy to Container Apps
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME }}
          CONTAINERAPP_RG: ${{ vars.CONTAINERAPP_RG }}
        run: |-
          set -euo pipefail
          image="${ACR_NAME}.azurecr.io/key-vault-pass:${GITHUB_REF_NAME}"
          # Build the container remotely in ACR (no local Docker needed).
          az acr build --registry "${ACR_NAME}" --image "${image}" .
          # Roll out the new revision.
          az containerapp update \
            --name "${CONTAINERAPP_NAME}" \
            --resource-group "${CONTAINERAPP_RG}" \
            --image "${image}"
